# Spectrum
#
# The styles themselves are in two files:
#   chatcolors.yml     the colours of chat messages
#   namegradients.yml  the gradients of player names
# Both use the same entries, see the examples in them. Reload with /spectrum reload.
#
# Every style has a permission, spectrum.chat.<id> or spectrum.name.<id>, and spectrum.chat.* / spectrum.name.*
# gives all of them. Players choose with /chatcolor equip <id> and /namegradient equip <id>, which is what
# a DeluxeMenus menu can run.

# Set to false to let every player use every style.
use-permissions: true

# The placeholder that gives the name to put the gradient on. Use a nickname placeholder if you have one,
# colours in it are removed. Leave empty to use the player's own name.
name-source: '%essentials_nickname%'

chat:
  # Players with the permission spectrum.chatcodes can write & colour codes and MiniMessage tags in messages.
  # Styles made of colours (mode: GRADIENT and so on) ignore them, styles with a format use them.
  allow-color-codes: false
  # The text shown by %spectrum_chat_preview_<id>% and /spectrum preview chat
  preview-text: "The quick brown fox"

# The glitch look for chat colours: white letters with a shadow in the colour of the style.
# A style turns it on with `glitch: true` in chatcolors.yml. `all: true` does it for every chat colour that is made of
# colours, and a style can still say `glitch: false`. Styles with a `format:` are never changed.
glitch:
  all: false
  # The colour of the letters. Any colour works: white, #ffffff, ...
  text: white

# Run by the console when an admin uses /namegradient admin give|remove or /chatcolor admin give|remove.
# {player} and {permission} are filled in. Empty to do nothing.
commands:
  permission-set: 'lp user {player} permission set {permission} true'
  permission-unset: 'lp user {player} permission unset {permission}'

# When the name from name-source has colours of its own (a /nick with &e or a hex colour), those are used and the
# gradient is left off. Set to false to always put the gradient on the name.
nickname-colors-win: true

# Anonymous usage beacon (plugin/version, server software/version, player counts). No player data, no IPs.
# Set enabled to false to turn it off entirely.
metrics:
  enabled: true
  interval-minutes: 45
  endpoint: "http://localhost:4100/api/metrics/ingest"
