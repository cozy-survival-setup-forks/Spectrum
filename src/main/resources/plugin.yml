name: Spectrum
version: '${version}'
main: dev.spectrum.SpectrumPlugin
api-version: '1.21'
description: Chat colours and name gradients, defined in two simple files
authors: [Groovified]
softdepend:
  - PlaceholderAPI

commands:
  chatcolor:
    description: Choose the colour of your chat messages
    usage: /<command> equip <id> | unequip | list
  namegradient:
    description: Choose your name gradient
    usage: /<command> equip <id> | unequip | list
  spectrum:
    description: Reload Spectrum or preview a style
    usage: /<command> reload | preview <chat|name> <id>

permissions:
  spectrum.use:
    description: Use /chatcolor and /namegradient
    default: true
  spectrum.admin:
    description: Reload, preview and give or remove styles
    default: op
  spectrum.chatcodes:
    description: Write colour codes and MiniMessage in chat messages (needs chat.allow-color-codes)
    default: false
  spectrum.chat.*:
    description: Use every chat colour
    default: op
  spectrum.name.*:
    description: Use every name gradient
    default: op
